data:
    dataset_name: RESC
    experiment_name: experiment_1
model:
    hidden_size: 384
    num_hidden_layers: 6
    num_attention_heads: 6
    intermediate_size: 1536

optimization:
    num_epochs: 40
    warmup_epochs: 4
    train_batch_size: 64
    start_lr: 1e-6
    peak_lr: 1e-3
    final_lr: 1e-5
    weight_decay: 0.05
    patience: 40 # epochs
    hidden_dropout_prob: 0.0
    layer_norm: False
    normalize_before_computing_distance: True
