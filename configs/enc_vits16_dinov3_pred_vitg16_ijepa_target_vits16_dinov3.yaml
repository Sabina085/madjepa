# NOTE: ImageNet-22K (IN22k) dataloader is not implemented
# please implement IN22k data loader based on your data
# storage format, and update the paths in your config
# to load from your IN22k dataset.
meta:
  use_bfloat16: true
  load_checkpoint_path: pretrained_checkpoints/init_checkpoints/enc_vits16_dinov3_pred_vitg16_ijepa_target_vits16_dinov3.pth.tar
  checkpoint_type: dinov3
  # encoder
  encoder_model_name: dinov3_vits16
  encoder_weights_source: pretrained_checkpoints/dinov3_checkpoints/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  encoder_embed_dim: 384
  # predictor
  predictor_model_name: ijepa_predictor_from_IN22K_vitg16_600e
  predictor_weights_source: pretrained_checkpoints/ijepa_checkpoints/IN22K-vit.g.16-600e.pth.tar
  predictor_depth: 16
  predictor_embed_dim: 384
  predictor_num_heads: 16
  # target encoder
  target_encoder_model_name: dinov3_vits16 # should be the same as for the context encoder 
  target_encoder_weights_source : pretrained_checkpoints/dinov3_checkpoints/dinov3_vits16_pretrain_lvd1689m-08c60483.pth # should be the same as for the context encoder

data:
 # training specifics
  batch_size: 32
  crop_size: 224
  crop_scale:
  - 0.3
  - 1.0

  image_folder: BraTS2021_slice/train/
  data_root_folder_path: /home/vhondru/istoian/BMAD/dataset
  pin_mem: True
  num_workers: 10

  # data augmentation / transformations
  color_jitter_strength: 0.0
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false


mask:
  patch_size: 16
  allow_overlap: false

  # -- encoder context box sampling rules
  enc_mask_scale:
  - 0.85
  - 1.0
  enc_mask_aspect_ratio:
  # sampled context has unit aspect ratio - as it was mentioned in the paper
  - 1.0
  - 1.0
  enc_min_keep: 10
  num_enc_masks: 1

   ### predictor/target encoder box sampling rules 
  pred_mask_scale:
  - 0.15
  - 0.2
  pred_mask_aspect_ratio:
  - 0.75
  - 1.5
  num_pred_masks: 4

optimization:
  num_epochs: 20
  ema:
  - 0.996
  - 1.0
  ipe_scale: 1.0

  lr: 0.001
  start_lr: 0.0002
  final_lr: 1.0e-06
  warmup: 3

  weight_decay: 0.04
  final_weight_decay: 0.4


logging:
  logging_folder: experiments/enc_vits16_dinov3_pred_vitg16_ijepa_target_vits16_dinov3/logs/
  write_tag: enc_vits16_dinov3_pred_vitg16_ijepa_target_vits16_dinov3