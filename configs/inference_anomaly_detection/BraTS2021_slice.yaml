# Inference configuration for BraTS2021_slice dataset

data:
  dataset_name: "BraTS2021_slice"
  experiment_name: "experiment_1"
  split: "test"

inference:
  # How many random target boxes to sample per image
  num_sampled_random_boxes_per_image: 30
  distance: "l2"
  aggregate_patches_strategy: "mean"
  gaussian_filter_blur_sigma_ijepa: 4
  gaussian_filter_blur_sigma_distillation: 4
  # For computing the image-level metrics
  image_statistic_for_classification: "max"
  global_seed_random_boxes: 0

misc:
  # If you want to save the masked images (non essential - useful for debugging and for understanding how the box sampling is performed)
  save_images_with_masks: False
