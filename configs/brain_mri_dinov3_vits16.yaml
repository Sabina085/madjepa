# NOTE: ImageNet-22K (IN22k) dataloader is not implemented
# please implement IN22k data loader based on your data
# storage format, and update the paths in your config
# to load from your IN22k dataset.
data:
  batch_size: 32
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: BraTS2021_slice/train/
  num_workers: 10
  pin_mem: false
  root_path: /home/vhondru/istoian/BMAD/dataset
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
logging:
  folder: /home/vhondru/istoian/ijepa/experiments/dinov3_enc_vits16_pred_vit_tiny_ijepa_target_vits16/logs/
  write_tag: jepa-brain-mri-dinov3-vits16
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
  - 0.15
  - 0.2
meta:
  load_checkpoint: true
  encoder_model_name: dinov3_vits16
  encoder_weights_path: pretrained_checkpoints/dinov3_checkpoints/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  predictor_model_name: ijepa_vit_tiny
  predictor_weights_path: pretrained_checkpoints/ijepa_checkpoints/IN22K-vit.h.14-900e.pth.tar
  target_encoder_model_name: dinov3_vits16
  target_encoder_weights_path: pretrained_checkpoints/dinov3_checkpoints/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  predictor_depth: 12
  encoder_embed_dim: 384
  predictor_embed_dim: 384
  predictor_num_heads: 6
  read_checkpoint: /home/vhondru/istoian/ijepa/pretrained_checkpoints/dinov3_checkpoints/dinov3_enc_vits16_pred_vit_tiny_ijepa_target_vits16.pth.tar
  use_bfloat16: true
  continue_training: false
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 20
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 3
  weight_decay: 0.04
